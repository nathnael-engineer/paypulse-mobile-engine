name: paypulse_mobile_engine
description: "High-concurrency Flutter mobile wallet with offline transaction queues and Go gRPC distributed ledger."
publish_to: "none"
version: 2.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  grpc: ^3.2.4
  protobuf: ^3.1.0
  local_auth: ^2.2.0
  uuid: ^4.4.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true